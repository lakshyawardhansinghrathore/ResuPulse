[theme]
primaryColor       = "#6366f1"
backgroundColor    = "#0a0b14"
secondaryBackgroundColor = "#0f1120"
textColor          = "#f1f5f9"
font               = "sans serif"

[server]
maxUploadSize     = 10
enableXsrfProtection = false
enableCORS        = false
headless          = true

[browser]
gatherUsageStats  = false

[client]
showSidebarNavigation = false
toolbarMode       = "minimal"
